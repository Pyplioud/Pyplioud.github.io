<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>
    <style>
        /* Reset e Estilos Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Cartão Principal */
        .card {
            background-color: #1e293b;
            max-width: 480px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        /* Foto de Perfil */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 16px;
        }

        /* Textos */
        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #38bdf8;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .bio {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* Lista de Botões/Links */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            background-color: #334155;
            color: #f8fafc;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            transform: translateY(-2px);
        }

        /* Rodapé */
        footer {
            margin-top: 28px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <main class="card">
        <!-- Substitua o link abaixo pela URL da sua foto (ou pelo link da sua foto do GitHub) -->
        <img src="https://github.com" alt="Foto de Perfil" class="avatar">
        
        <h1>Seu Nome Aqui</h1>
        <p class="subtitle">Desenvolvedor • Designer • Criador</p>
        
        <p class="bio">
            Olá! Bem-vindo à minha página pessoal. Aqui você encontra meus principais projetos, artigos e formas de entrar em contato.
        </p>

        <div class="links">
            <a href="https://github.com" target="_blank" class="btn">Meu GitHub</a>
            <a href="https://linkedin.com" target="_blank" class="btn">LinkedIn</a>
            <a href="#" target="_blank" class="btn">Meu Projeto Principal</a>
            <a href="mailto:seuemail@exemplo.com" class="btn">Entrar em Contato</a>
        </div>

        <footer>
            Feito com GitHub Pages
        </footer>
    </main>

</body>
</html>
