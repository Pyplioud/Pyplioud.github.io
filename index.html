<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrei Ryuji Ito Marca | Meteorology & Space Weather</title>
    
    <!-- Fonte mais aconchegante e moderna (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #090d16;
            overflow-x: hidden;
        }

        /* Vídeo em Loop no Fundo */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        /* Vinheta suave */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(13, 18, 30, 0.35) 0%, rgba(8, 11, 20, 0.8) 100%);
            z-index: -1;
        }

        /* Cartão Principal com tons quentes/crepusculares */
        .card {
            background: rgba(18, 22, 36, 0.62);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            max-width: 430px;
            width: 100%;
            padding: 40px 32px 30px;
            border-radius: 28px;
            text-align: center;
            border: 1px solid rgba(251, 191, 36, 0.16);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        /* Foto de Perfil com Outline Dourado/Crepúsculo */
        .avatar-wrapper {
            position: relative;
            width: 108px;
            height: 108px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #fbbf24, #f97316, #818cf8);
            box-shadow: 0 0 24px rgba(251, 191, 36, 0.25);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1e2436;
            display: block;
        }

        /* Textos */
        h1 {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .subtitle {
            color: #fbbf24; /* Dourado suave combinando com o horizonte do vídeo */
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .bio {
            color: #e2e8f0;
            font-size: 0.94rem;
            line-height: 1.65;
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* Botões Aconchegantes */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.07);
            color: #f8fafc;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.09);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            background: rgba(251, 191, 36, 0.16);
            border-color: rgba(251, 191, 36, 0.6);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -8px rgba(251, 191, 36, 0.35);
        }

        /* Rodapé */
        footer {
            margin-top: 28px;
            font-size: 0.78rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Vídeo de Fundo em Loop -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="background.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <main class="card">
        <!-- Foto de Perfil: Substitua SEU-USUARIO pelo seu login do GitHub -->
        <div class="avatar-wrapper">
            <img src="https://githubusercontent.com" alt="Andrei Ryuji Ito Marca" class="avatar">
        </div>
        
        <h1>Andrei Ryuji Ito Marca</h1>
        <p class="subtitle">Meteorology • Space Weather • Machine Learning</p>
        
        <p class="bio">
            Hi there, I'm Andrei! A huge Meteorology, Space Weather and ML lover! Here you can find more about me and the projects I'm working on.
        </p>

        <div class="links">
            <!-- Substitua os links dentro de href="..." -->
            <a href="https://github.com/Pyplioud" target="_blank" class="btn">My GitHub</a>
            <a href="https://www.linkedin.com/in/andrei-ryuji-ito-marca-51b975381/" target="_blank" class="btn">LinkedIn</a>
            <a href="https://github.com/Pyplioud/UR-Solar-Deep-Learning" target="_blank" class="btn">Current Project</a>
            <a href="mailto:andreirymarca@gmail.com" class="btn">Contact me!</a>
        </div>

        <footer>
            Atmos & Space Weather • GitHub Pages
        </footer>
    </main>

</body>
</html>
